name: Deploy to DreamHost

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: dreamhost-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm run test

      - name: 🏗️ Build production bundle
        run: npm run build
        env:
          VITE_WS_SERVER_URL: ${{ secrets.VITE_WS_SERVER_URL }}

      - name: 🔍 Resolve Target Directory and Auth Mode
        id: prep
        env:
          SSH_KEY: ${{ secrets.DREAMHOST_SSH_KEY }}
          PASSWORD: ${{ secrets.DREAMHOST_PASSWORD }}
          HOST: ${{ secrets.DREAMHOST_HOST }}
          USER: ${{ secrets.DREAMHOST_USER }}
          TARGET: ${{ secrets.DREAMHOST_TARGET }}
        run: |
          # Strip potential BOM (\xef\xbb\xbf), carriage returns, and leading/trailing whitespace
          CLEAN_HOST=$(printf '%s' "$HOST" | sed 's/^\xef\xbb\xbf//; s/^[[:space:]]*//; s/[[:space:]]*$//')
          CLEAN_USER=$(printf '%s' "$USER" | sed 's/^\xef\xbb\xbf//; s/^[[:space:]]*//; s/[[:space:]]*$//')
          CLEAN_TARGET=$(printf '%s' "$TARGET" | sed 's/^\xef\xbb\xbf//; s/^[[:space:]]*//; s/[[:space:]]*$//')

          if [ -z "$CLEAN_HOST" ]; then
            echo "::error::Secret DREAMHOST_HOST is not set."
            exit 1
          fi
          if [ -z "$CLEAN_USER" ]; then
            echo "::error::Secret DREAMHOST_USER is not set."
            exit 1
          fi

          echo "CLEAN_HOST=$CLEAN_HOST" >> $GITHUB_ENV
          echo "CLEAN_USER=$CLEAN_USER" >> $GITHUB_ENV

          if [ -n "$PASSWORD" ]; then
            echo "HAS_PASSWORD=true" >> $GITHUB_ENV
          else
            echo "HAS_PASSWORD=false" >> $GITHUB_ENV
          fi

          if [ -n "$SSH_KEY" ]; then
            echo "HAS_KEY=true" >> $GITHUB_ENV
          else
            echo "HAS_KEY=false" >> $GITHUB_ENV
          fi

          if [ -z "$PASSWORD" ] && [ -z "$SSH_KEY" ]; then
            echo "::error::Neither DREAMHOST_SSH_KEY nor DREAMHOST_PASSWORD secret is configured. Please add one of them to GitHub Secrets."
            exit 1
          fi

          DEST="$CLEAN_TARGET"
          if [ -z "$DEST" ]; then
            DEST="/home/$CLEAN_USER/$CLEAN_HOST/"
          fi
          # Ensure trailing slash
          [[ "$DEST" != */ ]] && DEST="${DEST}/"
          echo "RESOLVED_TARGET=$DEST" >> $GITHUB_ENV
          echo "Deploying dist/ -> $CLEAN_USER@$CLEAN_HOST:$DEST"

      - name: 🔑 Configure SSH Key (Key Auth)
        if: env.HAS_KEY == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DREAMHOST_SSH_KEY }}

      - name: 🚀 Deploy dist/ to DreamHost via Rsync (SSH Key)
        if: env.HAS_KEY == 'true'
        id: rsync_deploy
        continue-on-error: true
        run: |
          echo "Attempting deployment via SSH key & rsync..."
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10" ./dist/ "${CLEAN_USER}@${CLEAN_HOST}:${RESOLVED_TARGET}"
          echo "DEPLOYED=true" >> $GITHUB_ENV

      - name: 🚀 Deploy dist/ to DreamHost via SFTP (Password Fallback)
        if: env.DEPLOYED != 'true' && env.HAS_PASSWORD == 'true'
        env:
          SSHPASS: ${{ secrets.DREAMHOST_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          echo "Syncing production bundle to DreamHost via SFTP..."
          lftp <<EOF
            set cmd:fail-exit yes
            set sftp:auto-confirm yes
            set net:timeout 30
            set net:max-retries 3
            open -u "${CLEAN_USER},${SSHPASS}" "sftp://${CLEAN_HOST}"
            cd "${RESOLVED_TARGET}"
            mirror --reverse --delete --verbose ./dist .
            bye
          EOF
          echo "DEPLOYED=true" >> $GITHUB_ENV

      - name: 🛑 Verify Deployment Succeeded
        run: |
          if [ "$DEPLOYED" != "true" ]; then
            echo "::error::Deployment failed. Neither SSH Key nor Password authentication succeeded."
            exit 1
          fi

      - name: 🎉 Deployment Summary
        run: |
          echo "Terminal Haul client successfully synced to ${CLEAN_HOST}!"
