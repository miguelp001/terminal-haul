name: Deploy to DreamHost

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: dreamhost-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm run test

      - name: 🏗️ Build production bundle
        run: npm run build
        env:
          VITE_WS_SERVER_URL: ${{ secrets.VITE_WS_SERVER_URL }}

      - name: 🔍 Resolve Target Directory and Auth Mode
        id: prep
        env:
          SSH_KEY: ${{ secrets.DREAMHOST_SSH_KEY }}
          PASSWORD: ${{ secrets.DREAMHOST_PASSWORD }}
          HOST: ${{ secrets.DREAMHOST_HOST }}
          USER: ${{ secrets.DREAMHOST_USER }}
          TARGET: ${{ secrets.DREAMHOST_TARGET }}
        run: |
          if [ -z "$HOST" ]; then
            echo "::error::Secret DREAMHOST_HOST is not set."
            exit 1
          fi
          if [ -z "$USER" ]; then
            echo "::error::Secret DREAMHOST_USER is not set."
            exit 1
          fi

          if [ -n "$SSH_KEY" ]; then
            echo "AUTH_MODE=key" >> $GITHUB_ENV
            echo "Authenticating via SSH deploy key."
          elif [ -n "$PASSWORD" ]; then
            echo "AUTH_MODE=password" >> $GITHUB_ENV
            echo "Authenticating via SSH/SFTP password."
          else
            echo "::error::Neither DREAMHOST_SSH_KEY nor DREAMHOST_PASSWORD secret is configured. Please add one of them to GitHub Secrets."
            exit 1
          fi

          DEST="$TARGET"
          if [ -z "$DEST" ]; then
            DEST="/home/$USER/haul.dreamhost.com/"
          fi
          # Ensure trailing slash
          [[ "$DEST" != */ ]] && DEST="${DEST}/"
          echo "RESOLVED_TARGET=$DEST" >> $GITHUB_ENV
          echo "Deploying dist/ -> $USER@$HOST:$DEST"

      - name: 🔑 Configure SSH Key
        if: env.AUTH_MODE == 'key'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DREAMHOST_SSH_KEY }}

      - name: 🚀 Rsync dist/ to DreamHost (SSH Key)
        if: env.AUTH_MODE == 'key'
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" ./dist/ ${{ secrets.DREAMHOST_USER }}@${{ secrets.DREAMHOST_HOST }}:${{ env.RESOLVED_TARGET }}

      - name: 🚀 Rsync dist/ to DreamHost (Password)
        if: env.AUTH_MODE == 'password'
        env:
          SSHPASS: ${{ secrets.DREAMHOST_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          sshpass -e rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" ./dist/ ${{ secrets.DREAMHOST_USER }}@${{ secrets.DREAMHOST_HOST }}:${{ env.RESOLVED_TARGET }}

      - name: 🎉 Deployment Summary
        run: |
          echo "Terminal Haul client successfully synced to ${{ secrets.DREAMHOST_HOST }}!"
